services:
  web:
    build: .
    command: ["wait-for-it.sh", "db:5432", "--", "catalina.sh", "run"]
    ports:
     - "8080:8080"
    networks:
      static-network:
        ipv4_address: 172.20.128.1

  db:
    image: postgres:9.4
    ports:
     - "5432:5432"
    environment:
     POSTGRES_DB: manalith10
     POSTGRES_USER: manalith10
     POSTGRES_PASSWORD: manaadmin
    networks:
      static-network:
        ipv4_address: 172.20.128.2
    volumes:
      - ./src/main/sql/schema/dbinit.sql:/docker-entrypoint-initdb.d/dbinit.sql

networks:
  static-network:
    ipam:
      config:
        - subnet: 172.20.0.0/16
          ip_range: 172.20.5.0/24
